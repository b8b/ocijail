# rc.conf for the podman jail, installed as /jail/podman/etc/rc.conf.
#
# The jail runs its own rc, which brings up the jail's side of the epair, mounts
# the storage dataset that podman.conf attached to the jail, starts pf with the
# rules from /etc/pf.conf (see pf.conf in this directory), and starts the
# containers that have a --restart=always policy.

hostname="podman"

# Mounts zroot/podman at /var/db/containers.  The dataset is attached to the
# jail by zfs.dataset in podman.conf; the rc script only runs in a jail when
# mounting is allowed (allow.mount).
zfs_enable="YES"

# Loads /etc/pf.conf into the jail's vnet pf instance and enables it.
pf_enable="YES"

# net.inet.ip.forwarding=1 in the jail's vnet, between the CNI bridge and
# epair0b.
gateway_enable="YES"

# Starts every container with --restart=always when the jail starts and stops
# them again on shutdown (containers without that policy are left alone).
podman_enable="YES"

# epair0b is handed to the jail by vnet.interface in podman.conf.  Do not also
# configure it on the host.
ifconfig_epair0b="inet 10.99.0.2/24"
defaultrouter="10.99.0.1"
