# Storage configuration for the podman running inside the podman jail.
#
# Install as /usr/local/etc/containers/storage.conf in the jail.
#
# zroot/podman is created once with `-o mountpoint=/var/db/containers` and
# `jailed=on`, attached to the jail by `zfs.dataset` in podman.conf and mounted
# by the jail's rc (`zfs_enable=YES`), so the zfs driver can create and mount
# the layer datasets below it.  The driver looks up the dataset of the
# directory above graphroot, i.e. /var/db/containers, which is why the dataset
# is mounted there and not on the graphroot itself.
[storage]
driver = "zfs"
graphroot = "/var/db/containers/storage"
runroot = "/var/run/containers/storage"

# Without the ZFS dataset (no allow.mount.zfs and zfs.dataset in podman.conf)
# podman's storage is plain directories instead:
#
#driver = "vfs"
