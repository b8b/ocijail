# pf.conf for the podman jail, installed as /jail/podman/etc/pf.conf and loaded
# by pf_enable=YES in the jail's rc.conf.  That pf instance lives in the jail's
# vnet and is distinct from the host's.  The CNI plugins do not add the NAT rule
# themselves: ipMasq only fills the <cni-nat> table and portmap only writes
# into the cni-rdr/* anchors, so both have to exist here.
#
# epair0b is the jail's uplink (vnet.interface in podman.conf).

set skip on lo0

table <cni-nat>

nat on epair0b inet from <cni-nat> to any -> (epair0b)
nat on epair0b inet6 from <cni-nat> to !ff00::/8 -> (epair0b)

rdr-anchor "cni-rdr/*"
nat-anchor "cni-rdr/*"
