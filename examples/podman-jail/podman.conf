# Podman in a jail
#
# Install as /etc/jail.conf.d/podman.conf.  README.md in this directory has the
# host setup (dataset, bridge, forwarding, NAT, jail rootfs, jail rc.conf) and
# the configuration the podman inside the jail needs (containers.conf,
# storage.conf, pf.conf).

podman {
    path = "/jail/$name/";
    host = "inherit";

    # Podman gives every container a vnet of its own (it annotates the container
    # with org.freebsd.jail.vnet=new) and a jail can only grant a child what it
    # has itself, so the jail needs a vnet too.  epair0b is the jail's uplink;
    # the other end is put on a host bridge in exec.prestart below.  The jail's
    # own /etc/rc.conf brings the address, default route and pf up.
    vnet = "new";
    vnet.interface = "epair0b";

    # Ruleset 5 is devfsrules_jail_vnet from /etc/defaults/devfs.rules: the
    # usual jail devices plus zfs and pf.  Podman needs /dev/zfs for the zfs
    # storage driver and the `zfs` userland, /dev/pf for the CNI plugins and
    # pfctl.  ocijail keeps a container's devfs mount inside the jail at this
    # ruleset, so containers get the same devices.
    mount.devfs;
    devfs_ruleset = 5;

    # What ocijail needs to create containers inside this jail: allow.mount.*
    # for the file systems it mounts for them, allow.chflags and
    # allow.raw_sockets (which it sets on every container), and
    # allow.mount.zfs for the storage driver.  A child jail cannot be granted a
    # permission the parent does not have, so all of them have to be on the
    # jail itself.
    allow.chflags;
    allow.extattr;
    allow.raw_sockets;
    allow.mount;
    allow.mount.devfs;
    allow.mount.fdescfs;
    allow.mount.nullfs;
    allow.mount.tmpfs;
    allow.mount.zfs;

    # Mounts inside the jail, and the zfs storage driver looking up the dataset
    # of the graphroot, both need this; the default is 2.
    enforce_statfs = 1;

    # The jail gets its own System V IPC namespaces instead of sharing the
    # host's.  allow.sysvipc is deprecated and would mean "inherit", so it is
    # not set alongside these.
    sysvmsg = "new";
    sysvsem = "new";
    sysvshm = "new";

    # Every container is a child jail.
    children.max = 100;

    persist;
    exec.clean;
    exec.timeout = 30;
    exec.start = "/bin/sh /etc/rc";
    exec.stop = "/bin/sh /etc/rc.shutdown jail";

    # Host side of the uplink: one end of a fresh epair goes on the host bridge,
    # the other end is handed to the jail by vnet.interface, which jail(8) does
    # before exec.start.  The jail's rc.conf configures it from there.
    exec.prestart =
        "/sbin/ifconfig epair0b destroy 2>/dev/null || true",
        "/sbin/ifconfig epair0a destroy 2>/dev/null || true",
        "/sbin/ifconfig epair0 create",
        "/sbin/ifconfig epair0a up",
        "/sbin/ifconfig bridge0 addm epair0a";

    # Removing the jail returns the interfaces to the host vnet, so both ends
    # can be destroyed here; removing one end of an epair removes the pair.
    exec.poststop =
        "/sbin/ifconfig epair0b destroy 2>/dev/null || true",
        "/sbin/ifconfig epair0a destroy 2>/dev/null || true";

    # Exports zroot/podman to the jail after the jail exists and before
    # exec.start.  The dataset is created once on the host, unmounted, with its
    # mountpoint set to the path the jail sees:
    #
    #   zfs create -u -o mountpoint=/var/db/containers zroot/podman
    #   zfs set jailed=on zroot/podman
    #
    # `jailed=on` is what lets the jail manage the layer datasets podman creates
    # below it, and it makes the host's zfs rc skip the dataset (`zfs mount -a`
    # ignores jailed datasets in the global zone).  The jail's rc mounts it with
    # zfs_enable=YES.
    zfs.dataset = "zroot/podman";
}
