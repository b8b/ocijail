# Configuration for the podman running inside the podman jail.
#
# Install as /usr/local/etc/containers/containers.conf in the jail.
[engine]
runtime = "ocijail"
runtime_supports_json = ["ocijail"]

[engine.runtimes]
ocijail = ["/usr/local/bin/ocijail"]

[network]
network_backend = "cni"

[containers]
# A child jail without sysvmsg/sysvsem/sysvshm has no System V IPC at all, so
# these are given to every container.  ocijail understands them as jail
# parameters, and the jail itself has its own namespaces to hand out children
# of (see podman.conf).
annotations = [
    "org.freebsd.jail.sysvmsg=new",
    "org.freebsd.jail.sysvsem=new",
    "org.freebsd.jail.sysvshm=new",
]
